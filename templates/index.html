<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real Estate Price Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      color: #4361ee;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4361ee;
      color: white;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #3f37c9;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e0f0ff;
      border-left: 4px solid #4361ee;
      border-radius: 8px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>House Price Estimator (₹)</h1>
    <form method="POST">
      <div class="form-group">
        <label for="size">Property Size (sq ft)</label>
        <input type="number" id="size" name="size" required>
      </div>
      <div class="form-group">
        <label for="bedrooms">Number of Bedrooms</label>
        <input type="number" id="bedrooms" name="bedrooms" required>
      </div>
      <div class="form-group">
        <label for="age">Property Age (years)</label>
        <input type="number" id="age" name="age" required>
      </div>
      <button type="submit">Estimate Value</button>
    </form>

    {% if prediction_text %}
    <div class="result">
      {{ prediction_text }}
    </div>
    {% endif %}
  </div>
</body>
</html>
